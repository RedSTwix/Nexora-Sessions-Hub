name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar e compilar (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Preparar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Permitir execução do Gradle Wrapper
        run: chmod +x gradlew

      - name: Validar e compilar
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Armazenar APK de validação
        uses: actions/upload-artifact@v7
        with:
          name: Nexora-Sessions-Hub-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
