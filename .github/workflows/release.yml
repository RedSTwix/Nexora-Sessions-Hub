name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Assinar e publicar versão
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager não encontrado em $SDKMANAGER" >&2
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Permitir execução do Gradle Wrapper
        run: chmod +x gradlew

      - name: Identificar e validar versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName inválido: $VERSION" >&2
            exit 1
          fi
          if [[ -z "$VERSION_CODE" ]]; then
            echo "versionCode não foi encontrado." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A tag $TAG já existe." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validar segredos de assinatura
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Secret ANDROID_KEYSTORE_BASE64 ausente}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Secret ANDROID_KEYSTORE_PASSWORD ausente}"
          : "${ANDROID_KEY_ALIAS:?Secret ANDROID_KEY_ALIAS ausente}"
          : "${ANDROID_KEY_PASSWORD:?Secret ANDROID_KEY_PASSWORD ausente}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Compilar APK assinado
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease

      - name: Validar assinatura e preparar artefatos
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "apksigner não foi encontrado." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$SOURCE_APK"
          mkdir -p dist
          APK_NAME="Nexora-Sessions-Hub-v$VERSION.apk"
          cp "$SOURCE_APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          echo "apk=dist/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Armazenar resultado da versão
        uses: actions/upload-artifact@v7
        with:
          name: Nexora-Sessions-Hub-v${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.apk }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Atestar procedência do APK
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.apk }}

      - name: Criar e enviar tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nexora Sessions Hub $VERSION"
          git push origin "$TAG"

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexora Sessions Hub v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.apk }}
            dist/SHA256SUMS.txt

      - name: Remover chave temporária
        if: always()
        shell: bash
        run: rm -f release.keystore
